plugins {
    id 'java'
    id 'jacoco'
}

repositories {
    mavenCentral()
}

sourceSets {
    main {
        java {
            srcDirs = ['backend/src']
        }
    }
    test {
        java {
            srcDirs = ['backend/test']
        }
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

test {
    useJUnitPlatform()
    // Every test run also writes the coverage report.
    finalizedBy jacocoTestReport
}

// Coverage from the unit tests. Reports land in build/reports/jacoco/test/:
// html/index.html to browse, jacocoTestReport.csv for the CI summary,
// jacocoTestReport.xml for tools.
jacoco {
    toolVersion = '0.8.12'
}

jacocoTestReport {
    dependsOn test
    reports {
        html.required = true
        xml.required = true
        csv.required = true
    }
}

// The floor: `./gradlew build` (and so CI) fails if coverage drops below it.
// Set in Sprint 5 a little under what the tests reached (93.6% lines, 87.3%
// branches), so it catches a real drop without failing on small changes.
jacocoTestCoverageVerification {
    dependsOn test
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                minimum = 0.85
            }
            limit {
                counter = 'BRANCH'
                minimum = 0.75
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification
